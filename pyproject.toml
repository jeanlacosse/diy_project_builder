[project]
name = "shedguide"
version = "0.0.0"
description = "AI build guide app: chat to validated spec to framing plan to parts list"
requires-python = ">=3.13"
dependencies = ["pydantic>=2"]

[project.scripts]
shedguide = "shedguide.cli:run"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shedguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
